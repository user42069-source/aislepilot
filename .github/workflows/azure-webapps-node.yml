name: Test and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set public backend URL
        env:
          AISLEPILOT_API_URL: ${{ vars.AISLEPILOT_API_URL }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const apiBase=process.env.AISLEPILOT_API_URL||'';
          if(apiBase && (new URL(apiBase).protocol!=='https:' || new URL(apiBase).origin!==apiBase)) throw new Error('AISLEPILOT_API_URL must be an HTTPS origin without a trailing slash.');
          writeFileSync('site/config.js',`window.AISLEPILOT_CONFIG = ${JSON.stringify({apiBase})};\n`);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4